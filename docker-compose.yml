services:
  fatture_explorer:
    image: nginx:stable-alpine
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./security-headers.conf:/etc/nginx/security-headers.conf:ro
    container_name: fatture_explorer
    restart: unless-stopped

    # Irrobustimento: filesystem in sola lettura, solo le capability necessarie a nginx
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    mem_limit: 128m
    pids_limit: 100

networks:
  default:
    external: true
    name: nginx-proxy-manager

# Header di sicurezza comuni, inclusi da nginx.conf.
# Non c'è nulla da cambiare per usare l'app così com'è.
#
# In nginx un blocco "location" con add_header propri perde quelli del "server":
# se aggiungi un location con header propri, includi di nuovo questo file al suo interno.
# (La Content-Security-Policy e Cache-Control sono in nginx.conf.)

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;

# HSTS (Strict-Transport-Security) NON va messo qui: va attivato dove termina l'HTTPS,
# cioè nel proxy (in Nginx Proxy Manager: scheda SSL -> "HSTS Enabled").

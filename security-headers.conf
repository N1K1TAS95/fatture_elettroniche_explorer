# Header di sicurezza.
# In nginx un blocco "location" con add_header proprio perde quelli del "server":
# se aggiungi un location con header propri, includi di nuovo questo file.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;

# L'app non carica nulla da altre origini e non fa nessuna richiesta di rete (connect-src ricade su 'none').
# - script-src 'self'      : nessuno script inline, nessun gestore di eventi inline
# - style-src-attr         : servono solo gli attributi style="" generati dall'interfaccia
# - object-src / frame-src : blob: serve per aprire i PDF allegati alle fatture in una nuova scheda
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; object-src blob:; frame-src blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

# I file cambiano con gli aggiornamenti: il browser li ricontrolla sempre (ETag), senza scaricarli se invariati.
add_header Cache-Control "no-cache" always;

# HSTS e reindirizzamento da HTTP a HTTPS vanno impostati sul proxy che termina l'HTTPS (es. Nginx Proxy Manager).

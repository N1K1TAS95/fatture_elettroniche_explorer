# Esegue nginx con un utente senza privilegi.
user nginx;

worker_processes auto;

events { worker_connections 1024; }

http {
    server {
        # Subnet della rete Docker del proxy (docker network inspect nginx-proxy-manager):
        # serve a leggere l'IP reale del client dall'header X-Real-IP.
        set_real_ip_from 172.21.0.0/16;
        real_ip_header X-Real-IP;
        real_ip_recursive on;

        listen  80;
        root    /usr/share/nginx/html;
        include /etc/nginx/mime.types;

        # Nasconde la versione di nginx.
        server_tokens off;

        include /etc/nginx/security-headers.conf;

        # Sito statico: solo lettura.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Niente file nascosti (.git, .env, ...).
        location ~ /\. {
            return 404;
        }

        gzip            on;
        gzip_vary       on;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_types
                        application/javascript
                        application/json
                        image/svg+xml
                        text/css
                        text/plain;
    }
}

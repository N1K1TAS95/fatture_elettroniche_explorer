# ==============================================================================
#  Configurazione di nginx per Fatture Elettroniche Explorer (sito statico).
#
#  Funziona così com'è: i parametri da adattare al TUO ambiente sono indicati
#  con ">>> CAMBIA" (e sono tutti opzionali). Il README spiega tutto nel dettaglio.
# ==============================================================================

# Esegue nginx con un utente senza privilegi.
user nginx;

worker_processes auto;

events { worker_connections 1024; }

http {
    server {
        # >>> CAMBIA (opzionale) - IP reale dei client.
        # Serve solo se dietro un proxy (es. Nginx Proxy Manager) vuoi vedere nei log di nginx
        # l'IP del client invece di quello del proxy. L'app è statica e non ne ha bisogno:
        # lasciale commentate se non ti servono. Per attivarle, metti la subnet della rete
        # Docker del tuo proxy (la trovi con: docker network inspect <nome-rete>).
        #set_real_ip_from 172.18.0.0/16;
        #real_ip_header   X-Real-IP;
        #real_ip_recursive on;

        listen  80;
        root    /usr/share/nginx/html;
        include /etc/nginx/mime.types;

        # Nasconde la versione di nginx.
        server_tokens off;

        # Header di sicurezza comuni (vedi security-headers.conf).
        include /etc/nginx/security-headers.conf;

        # Content-Security-Policy dell'app: nessuna origine esterna, nessuno script inline.
        # >>> CAMBIA solo se aggiungi script, stili, font o immagini da altre origini.
        # (La stessa regola è anche nel <meta> di html/index.html: tienile allineate.)
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; object-src blob:; frame-src blob:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        # I file dell'app cambiano con gli aggiornamenti: il browser li ricontrolla sempre
        # (ETag) e li riscarica solo se modificati.
        add_header Cache-Control "no-cache" always;

        # Sito statico: solo lettura.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Il manifest della PWA: mime.types di nginx non conosce l'estensione .webmanifest.
        location ~ \.webmanifest$ {
            default_type application/manifest+json;
        }

        # Service worker (PWA).
        # In nginx un "location" con un proprio add_header perde quelli del "server":
        # per questo gli header comuni sono ripetuti qui.
        # La CSP del service worker è DIVERSA da quella della pagina: il worker deve poter
        # fare fetch verso la propria origine (connect-src 'self'), altrimenti non riesce
        # a riempire la cache. Se la CSP della pagina fosse applicata al worker, l'app
        # non sarebbe installabile.
        location = /sw.js {
            include /etc/nginx/security-headers.conf;
            add_header Content-Security-Policy "default-src 'none'; connect-src 'self'" always;
            add_header Cache-Control "no-cache" always;
        }

        # Niente file nascosti (.git, .env, ...).
        location ~ /\. {
            return 404;
        }

        gzip            on;
        gzip_vary       on;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_types
                        application/javascript
                        application/json
                        application/manifest+json
                        image/svg+xml
                        text/css
                        text/plain;
    }
}

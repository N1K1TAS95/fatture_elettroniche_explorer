# ==============================================================================
#  Fatture Elettroniche Explorer SENZA reverse proxy: il container pubblica una porta.
#
#  Avvio:   docker compose -f docker-compose.standalone.yml up -d
#
#  ATTENZIONE - HTTPS: raggiunto via "http://indirizzo:porta" il browser NON abilita la
#  selezione diretta delle cartelle e l'installazione come app (PWA): servono HTTPS o
#  localhost. Funziona solo la "modalità compatibile". Se possibile metti un proxy con
#  HTTPS davanti (vedi README) e usa docker-compose.yml.
#
#  Cosa cambiare (copia .env.example in .env e cambia lì i valori):
#
#    HOST_PORT       porta del computer su cui esporre l'app (predefinita: 8080)
#    BIND_ADDRESS    127.0.0.1 = raggiungibile solo da questo computer (predefinito, più sicuro)
#                    0.0.0.0   = raggiungibile da tutta la rete locale
#    CONTAINER_NAME  nome del container
# ==============================================================================

services:
  fatture_elettroniche_explorer:
    image: nginx:stable-alpine
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./security-headers.conf:/etc/nginx/security-headers.conf:ro
    container_name: ${CONTAINER_NAME:-fatture_elettroniche_explorer}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:80"

    # Irrobustimento: filesystem in sola lettura, solo le capability necessarie a nginx
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    mem_limit: 128m
    pids_limit: 100
